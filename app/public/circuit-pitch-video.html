<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIRCUIT — Realtime Programmable Capital Permissions (Pitch Video)</title>
  <style>
    :root {
      --mist: #B6BBD9;
      --deep: #122311;
      --shadow: #212413;
      --harvest: #AD8820;
      --terrain: #90844A;
      --forest: #444F24;
      --bg: #06080D;
      --card-bg: rgba(14, 18, 27, 0.94);
      --border: rgba(182, 187, 217, 0.16);
      --mint: #14F195;
      --amber: #FBBA24;
      --danger: #EF4444;
      --mono: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030407;
      color: var(--mist);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
    }

    .video-viewport {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--bg);
      border: 1px solid rgba(173, 136, 32, 0.35);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(18, 35, 17, 0.6);
    }

    canvas#motionCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Player Controls Bar */
    .controls-panel {
      width: 1280px;
      max-width: 100%;
      margin-top: 14px;
      padding: 14px 20px;
      background: #0c0f18;
      border: 1px solid rgba(182, 187, 217, 0.15);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timeline-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .timeline-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--forest), var(--harvest), var(--mint));
      border-radius: 3px;
      width: 0%;
      transition: width 0.05s linear;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-family: var(--mono);
      font-size: 12px;
    }

    .btn-ctrl {
      background: var(--shadow);
      border: 1px solid var(--border);
      color: var(--mist);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-ctrl:hover {
      background: var(--deep);
      border-color: var(--harvest);
      color: #fff;
    }
    .btn-ctrl.active {
      background: var(--harvest);
      color: #000;
      border-color: var(--harvest);
    }

    .scenes-nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .scene-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(182, 187, 217, 0.7);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }
    .scene-pill:hover, .scene-pill.active {
      background: rgba(173, 136, 32, 0.2);
      border-color: var(--harvest);
      color: #fff;
    }

    .badge-devnet {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--mint);
    }
    .badge-devnet::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 6px var(--mint);
    }

    /* Hidden video elements for hardware-accelerated playback */
    video.media-source {
      display: none;
    }
  </style>
</head>
<body>

  <div class="video-viewport">
    <canvas id="motionCanvas" width="1920" height="1080"></canvas>
  </div>

  <video id="videoProduct" class="media-source" src="./product.mp4" muted playsinline preload="auto"></video>
  <video id="videoLanding" class="media-source" src="./landing.mp4" muted playsinline preload="auto"></video>

  <div class="controls-panel">
    <div class="timeline-bar" id="timelineBar" title="Click or scrub timeline">
      <div class="timeline-fill" id="timelineFill"></div>
    </div>

    <div class="controls-row">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button type="button" class="btn-ctrl" id="btnPlayPause">▶ Play Video</button>
        <button type="button" class="btn-ctrl" id="btnRestart">↺ Restart</button>
        <button type="button" class="btn-ctrl" id="btnAudioToggle">🔊 Sound: ON</button>
        <span id="timecodeDisplay" style="color: var(--mist); letter-spacing: 0.05em;">00:00.00 / 01:12.00</span>
      </div>

      <div class="scenes-nav">
        <button class="scene-pill" onclick="seekTo(0)">01 Intro (0s)</button>
        <button class="scene-pill" onclick="seekTo(6)">02 Market Shock (6s)</button>
        <button class="scene-pill" onclick="seekTo(14)">03 Pipeline (14s)</button>
        <button class="scene-pill" onclick="seekTo(24)">04 Safe Borrow (24s)</button>
        <button class="scene-pill" onclick="seekTo(36)">05 Defensive Block (36s)</button>
        <button class="scene-pill" onclick="seekTo(48)">06 Dutch Auction (48s)</button>
        <button class="scene-pill" onclick="seekTo(58)">07 Meteora DBC (58s)</button>
        <button class="scene-pill" onclick="seekTo(68)">08 Principle (68s)</button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="badge-devnet">SOLANA DEVNET VERIFIED</span>
        <button type="button" class="btn-ctrl" id="btnExport" style="background: var(--forest); border-color: var(--mint); color: #fff;">
          ⬇ Export Video (WebM)
        </button>
      </div>
    </div>
  </div>

    const DURATION = 72.0; // 72 seconds pitch video duration (within 60-75s)
    let currentTime = 0.0;

    let audioEnabled = true;

    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d');
    const timelineFill = document.getElementById('timelineFill');
    const timelineBar = document.getElementById('timelineBar');
    const timecodeDisplay = document.getElementById('timecodeDisplay');

    // Web Audio Synthesizer (Restrained technical audio pulse)
    let audioCtx = null;
    let masterGain = null;
    let lastTickSecond = -1;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.28;
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTechTick(freq = 1400, decay = 0.015, gainVal = 0.15) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + decay);
        osc.connect(g);
        g.connect(masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + decay + 0.01);
      } catch (e) {}
    }

    function playRelayClick() {
      if (!audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
        g.gain.setValueAtTime(0.35, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.045);
        osc.connect(g);
        g.connect(masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function playSubHarmonicPulse() {
      if (!audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(55, audioCtx.currentTime);
        g.gain.setValueAtTime(0.25, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(g);
        g.connect(masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function playChordConfirmation() {
      if (!audioEnabled || !audioCtx) return;
      [110, 165, 220, 275].forEach((f, i) => {
        try {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.03);
          g.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.03 + 0.6);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(audioCtx.currentTime + i * 0.03);
          osc.stop(audioCtx.currentTime + i * 0.03 + 0.65);
        } catch (e) {}
      });
    }

    // Helper functions
    function pad(n, len = 2) { return String(n).padStart(len, '0'); }
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      return `${pad(m)}:${pad(s)}.${pad(ms)}`;
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    // RENDER LOOP
    function render(time) {
      ctx.clearRect(0, 0, 1920, 1080);

      // Deep institutional background
      ctx.fillStyle = '#06080D';
      ctx.fillRect(0, 0, 1920, 1080);

      // Engineering grid
      drawGrid();

      // Top Status Bar (Persistent Protocol Telemetry)
      drawProtocolHeader(time);

      // Scene Dispatcher (72 Seconds Total)
      if (time >= 0 && time < 6.0) {
        renderScene1_Intro(time);
      } else if (time >= 6.0 && time < 14.0) {
        renderScene2_MarketShock(time - 6.0);
      } else if (time >= 14.0 && time < 24.0) {
        renderScene3_Pipeline(time - 14.0);
      } else if (time >= 24.0 && time < 36.0) {
        renderScene4_SafeBorrow(time - 24.0);
      } else if (time >= 36.0 && time < 48.0) {
        renderScene5_DefensiveBlock(time - 36.0);
      } else if (time >= 48.0 && time < 58.0) {
        renderScene6_DutchAuction(time - 48.0);
      } else if (time >= 58.0 && time < 68.0) {
        renderScene7_MeteoraDbc(time - 58.0);
      } else if (time >= 68.0 && time <= 72.0) {
        renderScene8_Principle(time - 68.0);
      }

      // Bottom Status Telemetry Line
      drawProtocolFooter(time);
    }

    function drawGrid() {
      ctx.save();
      ctx.strokeStyle = 'rgba(182, 187, 217, 0.035)';
      ctx.lineWidth = 1;
      const step = 80;
      for (let x = step; x < 1920; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1080);
        ctx.stroke();
      }
      for (let y = step; y < 1080; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1920, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawProtocolHeader(time) {
      ctx.save();
      ctx.font = '600 13px "JetBrains Mono", monospace';
      ctx.fillStyle = '#B6BBD9';
      ctx.fillText('CIRCUIT PROGRAM PROTOCOL // SOLANA DEVNET', 60, 48);

      // Active status pills
      const rpcStatus = '● SOLANA RPC: 113ms';
      const pythStatus = '● PYTH CONFIDENCE: ±18 bps (SAFE)';
      const circuitStatus = '● CIRCUIT ENGINE: ACTIVE';

      ctx.fillStyle = '#14F195';
      ctx.fillText(rpcStatus, 680, 48);
      ctx.fillText(pythStatus, 1020, 48);
      ctx.fillText(circuitStatus, 1500, 48);

      ctx.strokeStyle = 'rgba(182, 187, 217, 0.12)';
      ctx.beginPath();
      ctx.moveTo(60, 68);
      ctx.lineTo(1860, 68);
      ctx.stroke();
      ctx.restore();
    }

    function drawProtocolFooter(time) {
      ctx.save();
      ctx.strokeStyle = 'rgba(182, 187, 217, 0.12)';
      ctx.beginPath();
      ctx.moveTo(60, 1020);
      ctx.lineTo(1860, 1020);
      ctx.stroke();

      ctx.font = '500 12px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(182, 187, 217, 0.55)';
      ctx.fillText(`EPOCH: #04829  SLOT: ${Math.floor(298412850 + time * 2.5)}  TX CONFIRMATION: FINALIZED`, 60, 1048);
      ctx.fillText('PROGRAM ID: Cq4Lvd6Kgr3a2aP6ENPVGQ8tUpbkGmoWr9ZDBdXGiTs2', 720, 1048);
      ctx.fillText('METEORA DBC: dbcij3LWacW1ZqjTqT5899nL2', 1340, 1048);
      ctx.restore();
    }

        ctx.drawImage(dbcImg, 0, 0, dbcImg.width, dbcImg.height, 60, y, imgW, imgH);
      } else {
        ctx.fillStyle = '#0c0f18';
        ctx.fillRect(60, y, imgW, imgH);
      }
      ctx.strokeStyle = 'rgba(20, 241, 149, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(60, y, imgW, imgH);

      // Bottom recording banner
      ctx.fillStyle = '#0c0f18';
      ctx.fillRect(60, y + imgH - 44, imgW, 44);
      ctx.strokeStyle = 'rgba(20, 241, 149, 0.4)';
      ctx.strokeRect(60, y + imgH - 44, imgW, 44);
      ctx.font = '700 12px "JetBrains Mono", monospace';
      ctx.fillStyle = '#14F195';
      ctx.fillText('● LIVE ON-CHAIN DEVNET DBC: NVDA/USDC | 100% CAPACITY SAFE', 80, y + imgH - 17);

      // Right: Telemetry & Circuit Risk Boundary
      const x2 = 1100;
      const w2 = 760;
      ctx.fillStyle = 'rgba(18, 35, 17, 0.65)';
      ctx.fillRect(x2, y, w2, imgH);
      ctx.strokeStyle = 'rgba(173, 136, 32, 0.4)';
      ctx.strokeRect(x2, y, w2, imgH);

      ctx.font = '700 18px "JetBrains Mono", monospace';
      ctx.fillStyle = '#14F195';
      ctx.fillText('METEORA DBC DEVNET POOL STATUS', x2 + 35, y + 45);

      const metrics = [
        { label: 'POOL IDENTIFIER', val: 'dbcij3LWacW1ZqjTqT5899nL2' },
        { label: 'CURVE STATUS', val: '● ACTIVE BONDING CURVE' },
        { label: 'VIRTUAL RESERVES', val: '1,000,000 NVDAx / $128,500 USDC' },
        { label: 'MIGRATION THRESHOLD', val: '$50,000.00 USDC to DAMM' },
        { label: 'VENUE ISOLATION', val: 'EXECUTION ONLY (Non-governing)' },
        { label: 'RISK GOVERNANCE', val: 'Enforced by Circuit Program' }
      ];

      metrics.forEach((m, idx) => {
        const itemY = y + 95 + idx * 56;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.fillRect(x2 + 35, itemY, w2 - 70, 44);
        ctx.font = '600 11.5px "JetBrains Mono", monospace';
        ctx.fillStyle = '#B6BBD9';
        ctx.fillText(m.label, x2 + 50, itemY + 27);

        ctx.font = '700 13px "JetBrains Mono", monospace';
        ctx.fillStyle = m.label === 'CURVE STATUS' ? '#14F195' : '#FFFFFF';
        ctx.fillText(m.val, x2 + 240, itemY + 27);
      });

      // Verification banner
      ctx.fillStyle = 'rgba(173, 136, 32, 0.2)';
      ctx.fillRect(x2 + 35, y + 480, w2 - 70, 160);
      ctx.strokeStyle = '#AD8820';
      ctx.strokeRect(x2 + 35, y + 480, w2 - 70, 160);

      ctx.font = '700 14px "JetBrains Mono", monospace';
      ctx.fillStyle = '#AD8820';
      ctx.fillText('CIRCUIT INVARIANT 10: TRADING VENUE ISOLATION', x2 + 55, y + 520);

      ctx.font = '400 12.5px "JetBrains Mono", monospace';
      ctx.fillStyle = '#B6BBD9';
      ctx.fillText('Meteora DBC provides programmatic execution liquidity.', x2 + 55, y + 560);
      ctx.fillText('Circuit enforces collateralization, liquidation, and permission rules.', x2 + 55, y + 590);
      ctx.restore();
    }

    // SCENE 8: 68–75s FINAL PRINCIPLE & CALL TO ACTION
    function renderScene8_Principle(t) {
      ctx.save();
      ctx.font = '750 14px "JetBrains Mono", monospace';
      ctx.fillStyle = '#AD8820';
      ctx.fillText('THE CORE PRINCIPLE // 08', 60, 140);

      const lines = [
        'HUMANS DEFINE AUTHORITY.',
        'AGENTS OPERATE WITHIN IT.',
        'MARKET CONDITIONS CHANGE IT.',
        'CIRCUIT ENFORCES IT.',
        'SOLANA RECORDS IT.'
      ];

      lines.forEach((line, idx) => {
        ctx.font = '700 48px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillStyle = idx === 3 ? '#14F195' : idx === 4 ? '#AD8820' : '#FFFFFF';
        ctx.fillText(line, 60, 240 + idx * 72);
      });

      // Final Devnet lockup card
      const y = 640;
      ctx.fillStyle = 'rgba(18, 35, 17, 0.7)';
      ctx.fillRect(60, y, 1800, 240);
      ctx.strokeStyle = '#14F195';
      ctx.lineWidth = 2;
      ctx.strokeRect(60, y, 1800, 240);

      ctx.font = '800 32px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('CIRCUIT PROTOCOL', 100, y + 65);

      ctx.font = '700 16px "JetBrains Mono", monospace';
      ctx.fillStyle = '#14F195';
      ctx.fillText('● LIVE ON SOLANA DEVNET', 100, y + 115);

      ctx.font = '400 14px "JetBrains Mono", monospace';
      ctx.fillStyle = '#B6BBD9';
      ctx.fillText('Program ID: Cq4Lvd6Kgr3a2aP6ENPVGQ8tUpbkGmoWr9ZDBdXGiTs2', 100, y + 160);
      ctx.fillText('Live DApp: https://circuit-on-solana.vercel.app', 100, y + 195);
      ctx.fillText('Documentation: github.com/Patel5600/Circuit (Apache-2.0 open-source)', 980, y + 195);
      ctx.restore();
    }

    // AUDIO TICKS & TRANSITION EFFECTS
    function handleAudioEvents(time) {
      const currentSec = Math.floor(time);
      if (currentSec !== lastTickSecond) {
        lastTickSecond = currentSec;
        // Periodic heartbeat pulse
        playTechTick(900, 0.01, 0.08);

        // Major scene change audio cue
        if ([0, 6, 14, 24, 36, 48, 58, 68].includes(currentSec)) {
          if (currentSec === 36) {
            playRelayClick(); // Defensive state mechanical clunk
          } else if (currentSec === 24 || currentSec === 68) {
            playChordConfirmation();
          } else {
            playSubHarmonicPulse();
          }
        }
      }
    }

    // ANIMATION LOOP
    function loop(now) {
      if (isPlaying) {
        const delta = (now - lastFrameTime) / 1000;
        currentTime += delta;
        if (currentTime >= DURATION) {
          currentTime = DURATION;
          isPlaying = false;
          btnPlayPause.textContent = '▶ Replay Video';
        }
        handleAudioEvents(currentTime);
      }
      lastFrameTime = now;

      render(currentTime);

      // Update UI
      timecodeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(DURATION)}`;
      timelineFill.style.width = `${(currentTime / DURATION) * 100}%`;

      requestAnimationFrame(loop);
    }

    // CONTROLS
    function togglePlay() {
      initAudio();
      isPlaying = !isPlaying;
      btnPlayPause.textContent = isPlaying ? '❚❚ Pause Video' : '▶ Play Video';
      lastFrameTime = performance.now();
    }

    function seekTo(sec) {
      currentTime = clamp(sec, 0, DURATION);
      timecodeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(DURATION)}`;
      timelineFill.style.width = `${(currentTime / DURATION) * 100}%`;
      render(currentTime);
    }

    btnPlayPause.onclick = togglePlay;
    btnRestart.onclick = () => seekTo(0);
    btnAudioToggle.onclick = () => {
      audioEnabled = !audioEnabled;
      btnAudioToggle.textContent = audioEnabled ? '🔊 Sound: ON' : '🔇 Sound: MUTED';
    };

    timelineBar.onclick = (e) => {
      const rect = timelineBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      seekTo(pct * DURATION);
    };

    // EXPORT TO WEBM
    btnExport.onclick = () => {
      initAudio();
      btnExport.textContent = '⏳ Recording...';
      btnExport.disabled = true;

      const videoStream = canvas.captureStream(60);
      if (audioCtx && masterGain) {
        const audioDest = audioCtx.createMediaStreamDestination();
        masterGain.connect(audioDest);
        const audioTrack = audioDest.stream.getAudioTracks()[0];
        if (audioTrack) videoStream.addTrack(audioTrack);
      }

      let recorder;
      try {
        recorder = new MediaRecorder(videoStream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12000000 });
      } catch (e) {
        recorder = new MediaRecorder(videoStream);
      }

      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'circuit-pitch-video.webm';
        a.click();
        btnExport.textContent = '⬇ Export Video (WebM)';
        btnExport.disabled = false;
      };

      currentTime = 0;
      isPlaying = true;
      lastFrameTime = performance.now();
      recorder.start();

      const exportTimer = setInterval(() => {
        if (currentTime >= DURATION) {
          clearInterval(exportTimer);
          recorder.stop();
          isPlaying = false;
        }
      }, 100);
    };

    // Auto-render initial frame
    window.onload = () => {
      render(0);
      requestAnimationFrame(loop);
    };
  </script>
</body>
