<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https://api.devnet.solana.com https://devnet.helius-rpc.com https://hermes.pyth.network wss://api.devnet.solana.com https://generativelanguage.googleapis.com https://query1.finance.yahoo.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"
    />

    <title>circuit — Programmable Credit Infrastructure for Tokenized Equities on Solana</title>
    <meta
      name="description"
      content="circuit provides programmable credit infrastructure for tokenized equities on Solana."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="circuit" />
    <meta property="og:title" content="circuit — Programmable Credit Infrastructure for Tokenized Equities on Solana" />
    <meta
      property="og:description"
      content="circuit provides programmable credit infrastructure for tokenized equities on Solana."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="circuit — Programmable Credit Infrastructure for Tokenized Equities on Solana" />
    <meta
      name="twitter:description"
      content="circuit provides programmable credit infrastructure for tokenized equities on Solana."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0b0d'/><path d='M22 11.2a8 8 0 100 9.6' fill='none' stroke='%23f2f4f6' stroke-width='2.6' stroke-linecap='round'/><circle cx='23.4' cy='16' r='2.1' fill='%235b8def'/></svg>"
    />
  </head>
  <body>
    <!--
      #root carries a static fallback. main.tsx clears it before mounting, so it
      is only ever visible when the JavaScript bundle failed to load or execute.
      Without it, such a failure renders as an unexplained dark page.
    -->
    <div id="root">
      <div id="boot">
        <div class="boot__card">
          <div class="boot__brand">circuit</div>
          <p class="boot__msg">Loading the interface&hellip;</p>
          <noscript>
            <p class="boot__msg">
              This application needs JavaScript enabled.
            </p>
          </noscript>
          <p class="boot__hint">
            If this message stays on screen, the interface failed to start.
            Try a hard reload (Ctrl+Shift+R) &mdash; after a dev-server restart
            the browser can hold a stale module graph.
          </p>
          <pre id="boot-error" class="boot__err" hidden></pre>
        </div>
      </div>
    </div>

    <style>
      /* Inline so the fallback is styled even if the stylesheet never loads. */
      body {
        margin: 0;
        background: #0a0b0d;
        color: #eef1f5;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Arial, sans-serif;
      }
      #boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .boot__card {
        max-width: 420px;
        text-align: center;
      }
      .boot__brand {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin-bottom: 10px;
      }
      .boot__msg {
        font-size: 14px;
        color: #99a2ae;
        margin: 0 0 14px;
      }
      .boot__hint {
        font-size: 12px;
        color: #676f7c;
        margin: 0;
        line-height: 1.6;
      }
      .boot__err {
        margin: 14px 0 0;
        padding: 10px 12px;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.55;
        color: #ef5f6b;
        background: rgba(239, 95, 107, 0.08);
        border: 1px solid rgba(239, 95, 107, 0.34);
        border-radius: 8px;
      }
    </style>

    <script>
      // Surfaces module load / evaluation failures into the boot card. Without
      // this, a failed entry chunk leaves only a dark page and the user has no
      // way to report what actually went wrong.
      (function () {
        function show(text) {
          var el = document.getElementById("boot-error");
          if (!el) return;
          el.hidden = false;
          el.textContent = String(text).slice(0, 600);
        }
        window.addEventListener("error", function (e) {
          if (e && e.target && e.target.tagName === "SCRIPT") {
            show("Failed to load script: " + (e.target.src || "unknown"));
          } else if (e && e.message) {
            show(e.message);
          }
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          show((r && (r.message || r)) || "Unhandled promise rejection");
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
